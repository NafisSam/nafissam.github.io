<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-hidden="true">
  <title>D-CLA — open clinical notebook beside a guideline-informed decision panel</title>
  <rect width="600" height="320" fill="#f0e9da"/>
  <circle cx="90" cy="60" r="100" fill="#567da2" opacity="0.14"/>
  <circle cx="520" cy="280" r="120" fill="#cb8963" opacity="0.18"/>

  <!-- open notebook -->
  <g>
    <path d="M66 88 L262 78 L268 262 L72 274 Z" fill="#fffaf1" stroke="#d4d3ca" stroke-width="2"/>
    <line x1="168" y1="80" x2="170" y2="270" stroke="#d4d3ca" stroke-width="2"/>
    <circle cx="168" cy="94" r="4" fill="#d4d3ca"/>
    <circle cx="168" cy="130" r="4" fill="#d4d3ca"/>
    <circle cx="168" cy="166" r="4" fill="#d4d3ca"/>
    <circle cx="168" cy="202" r="4" fill="#d4d3ca"/>
    <circle cx="168" cy="238" r="4" fill="#d4d3ca"/>

    <text x="88" y="116" font-family="Cormorant Garamond, serif" font-style="italic" font-size="20" fill="#204f50">Case</text>
    <text x="88" y="140" font-family="Cormorant Garamond, serif" font-style="italic" font-size="15" fill="#3a4a49">52-year-old male</text>
    <text x="88" y="160" font-family="Cormorant Garamond, serif" font-style="italic" font-size="15" fill="#3a4a49">T2DM, HTN</text>
    <text x="88" y="180" font-family="Cormorant Garamond, serif" font-style="italic" font-size="15" fill="#3a4a49">A1c 8.7%</text>

    <text x="188" y="140" font-family="Cormorant Garamond, serif" font-style="italic" font-size="17" fill="#a85638">Question</text>
    <text x="188" y="162" font-family="Cormorant Garamond, serif" font-style="italic" font-size="14" fill="#3a4a49">What is the next</text>
    <text x="188" y="180" font-family="Cormorant Garamond, serif" font-style="italic" font-size="14" fill="#3a4a49">best step?</text>
  </g>

  <!-- decision support panel -->
  <g font-family="Inter, sans-serif">
    <rect x="300" y="86" width="234" height="176" rx="10" fill="#123d3f"/>
    <text x="324" y="122" font-size="13.5" fill="#f0e9da">Based on ADA guidelines,</text>
    <text x="324" y="142" font-size="13.5" fill="#f0e9da">consider SGLT2 inhibitor</text>
    <text x="324" y="162" font-size="13.5" fill="#f0e9da">given ASCVD risk and</text>
    <text x="324" y="182" font-size="13.5" fill="#f0e9da">eGFR &#8805; 60.</text>

    <rect x="324" y="206" width="70" height="26" rx="13" fill="#204f50"/>
    <text x="359" y="223" font-size="11" fill="#f0e9da" text-anchor="middle">Guideline</text>
    <rect x="402" y="206" width="58" height="26" rx="13" fill="#204f50"/>
    <text x="431" y="223" font-size="11" fill="#f0e9da" text-anchor="middle">Evidence</text>
    <rect x="468" y="206" width="72" height="26" rx="13" fill="#204f50"/>
    <text x="504" y="223" font-size="11" fill="#f0e9da" text-anchor="middle">References</text>
  </g>
</svg>
