<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-hidden="true">
  <title>HALAJ — clinical report transforming into structured data</title>
  <rect width="600" height="320" fill="#f0e9da"/>
  <circle cx="470" cy="70" r="120" fill="#aaab9a" opacity="0.35"/>
  <circle cx="60" cy="270" r="90" fill="#cb8963" opacity="0.22"/>

  <!-- paper stack -->
  <g>
    <rect x="78" y="96" width="150" height="182" rx="6" fill="#fffaf1" stroke="#d4d3ca" stroke-width="2" transform="rotate(-6 153 187)"/>
    <rect x="70" y="88" width="150" height="182" rx="6" fill="#fffaf1" stroke="#d4d3ca" stroke-width="2" transform="rotate(-2 145 179)"/>
    <rect x="64" y="82" width="150" height="182" rx="6" fill="#fffaf1" stroke="#d4d3ca" stroke-width="2"/>
    <text x="84" y="112" font-family="Inter, sans-serif" font-size="11" letter-spacing="1.5" fill="#667271">CLINICAL REPORT</text>
    <line x1="84" y1="128" x2="198" y2="128" stroke="#d4d3ca" stroke-width="3"/>
    <line x1="84" y1="144" x2="198" y2="144" stroke="#d4d3ca" stroke-width="3"/>
    <line x1="84" y1="160" x2="170" y2="160" stroke="#d4d3ca" stroke-width="3"/>
    <line x1="84" y1="186" x2="198" y2="186" stroke="#e5e2d4" stroke-width="3"/>
    <line x1="84" y1="202" x2="198" y2="202" stroke="#e5e2d4" stroke-width="3"/>
    <line x1="84" y1="218" x2="150" y2="218" stroke="#e5e2d4" stroke-width="3"/>
    <line x1="84" y1="240" x2="198" y2="240" stroke="#e5e2d4" stroke-width="3"/>
    <line x1="84" y1="256" x2="180" y2="256" stroke="#e5e2d4" stroke-width="3"/>
  </g>

  <!-- arrow -->
  <path d="M256 178 H320" stroke="#17292a" stroke-width="3" stroke-linecap="round"/>
  <path d="M306 164 L320 178 L306 192" fill="none" stroke="#17292a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- structured table -->
  <g font-family="Inter, sans-serif">
    <rect x="352" y="98" width="192" height="166" rx="8" fill="#fffaf1" stroke="#d4d3ca" stroke-width="2"/>
    <text x="368" y="124" font-size="12" fill="#667271" letter-spacing="0.5">Patient ID</text>
    <text x="500" y="124" font-size="12" fill="#17292a" text-anchor="end">••••••</text>
    <line x1="368" y1="134" x2="528" y2="134" stroke="#eee9dc" stroke-width="1.5"/>

    <text x="368" y="154" font-size="12" fill="#667271">Age / Sex</text>
    <text x="500" y="154" font-size="12" fill="#17292a" text-anchor="end">64 / F</text>
    <line x1="368" y1="164" x2="528" y2="164" stroke="#eee9dc" stroke-width="1.5"/>

    <text x="368" y="184" font-size="12" fill="#667271">Diagnosis</text>
    <text x="500" y="184" font-size="12" fill="#17292a" text-anchor="end">Heart failure</text>
    <line x1="368" y1="194" x2="528" y2="194" stroke="#eee9dc" stroke-width="1.5"/>

    <text x="368" y="214" font-size="12" fill="#667271">Medications</text>
    <text x="500" y="214" font-size="12" fill="#17292a" text-anchor="end">Losartan</text>
    <line x1="368" y1="224" x2="528" y2="224" stroke="#eee9dc" stroke-width="1.5"/>

    <text x="368" y="244" font-size="12" fill="#667271">Lab (eGFR)</text>
    <text x="500" y="244" font-size="12" fill="#17292a" text-anchor="end">68</text>
  </g>
</svg>
