<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" role="img" aria-hidden="true">
  <title>Stethoscope illustration</title>
  <defs>
    <linearGradient id="steth-tube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2b28"/>
      <stop offset="1" stop-color="#17292a"/>
    </linearGradient>
    <radialGradient id="steth-disc" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#f4f1e8"/>
      <stop offset="0.55" stop-color="#c9c6bb"/>
      <stop offset="1" stop-color="#8f8d84"/>
    </radialGradient>
    <linearGradient id="steth-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8d6cc"/>
      <stop offset="1" stop-color="#8f8d84"/>
    </linearGradient>
  </defs>

  <!-- headband arc connecting the two ear tips -->
  <path d="M398 40 C 398 8, 468 8, 468 40" fill="none" stroke="url(#steth-metal)" stroke-width="10" stroke-linecap="round"/>

  <!-- earpieces -->
  <g stroke="url(#steth-metal)" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M398 40 L398 88"/>
    <path d="M468 40 L468 88"/>
  </g>
  <ellipse cx="398" cy="32" rx="13" ry="18" fill="url(#steth-metal)"/>
  <ellipse cx="468" cy="32" rx="13" ry="18" fill="url(#steth-metal)"/>

  <!-- binaural tubes joining -->
  <path d="M398 88 C 398 140, 434 140, 434 176" fill="none" stroke="url(#steth-tube)" stroke-width="12" stroke-linecap="round"/>
  <path d="M468 88 C 468 140, 434 140, 434 176" fill="none" stroke="url(#steth-tube)" stroke-width="12" stroke-linecap="round"/>

  <!-- long tube down to chestpiece, S curve sweeping toward the lower-left -->
  <path d="M434 176
           C 434 230, 360 226, 350 288
           C 341 346, 205 330, 196 404
           C 190 452, 226 462, 226 508"
        fill="none" stroke="url(#steth-tube)" stroke-width="14" stroke-linecap="round"/>

  <!-- chestpiece stem -->
  <path d="M226 508 C 224 520, 222 528, 224 538" fill="none" stroke="url(#steth-metal)" stroke-width="9" stroke-linecap="round"/>

  <!-- chestpiece diaphragm -->
  <g transform="translate(226,560)">
    <circle r="34" fill="url(#steth-metal)"/>
    <circle r="26" fill="url(#steth-disc)"/>
    <circle r="26" fill="none" stroke="#7a7870" stroke-width="1.5" opacity="0.5"/>
  </g>
</svg>
