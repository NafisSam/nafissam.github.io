<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-hidden="true">
  <title>Kidney Transplant Journey Platform — patient journey landscape with progress card</title>
  <rect width="600" height="320" fill="#f0e9da"/>
  <path d="M0 220 C 100 180, 220 240, 340 200 C 420 172, 500 210, 600 190 V320 H0 Z" fill="#aaab9a" opacity="0.4"/>
  <path d="M0 260 C 120 230, 260 280, 400 250 C 480 232, 540 260, 600 248 V320 H0 Z" fill="#78836d" opacity="0.35"/>
  <circle cx="500" cy="70" r="46" fill="#cb8963" opacity="0.3"/>

  <!-- winding path -->
  <path d="M40 250 C 90 190, 150 230, 190 180 C 230 130, 280 170, 305 118 C 322 82, 360 96, 330 60" fill="none" stroke="#fffaf1" stroke-width="10" stroke-linecap="round"/>
  <path d="M40 250 C 90 190, 150 230, 190 180 C 230 130, 280 170, 305 118 C 322 82, 360 96, 330 60" fill="none" stroke="#cb8963" stroke-width="3" stroke-dasharray="1 12" stroke-linecap="round"/>

  <!-- signposts -->
  <g font-family="Inter, sans-serif" font-size="12" fill="#17292a">
    <g transform="translate(40,250)">
      <line x1="0" y1="0" x2="0" y2="-46" stroke="#a85638" stroke-width="4"/>
      <path d="M0 -46 h58 l-8 10 8 10 h-58 z" fill="#cb8963"/>
      <text x="8" y="-40" fill="#fffaf1">Evaluation</text>
    </g>
    <g transform="translate(190,180)">
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#a85638" stroke-width="4"/>
      <path d="M0 -40 h50 l-8 10 8 10 h-50 z" fill="#204f50"/>
      <text x="8" y="-34" fill="#fffaf1">Waitlist</text>
    </g>
    <g transform="translate(305,118)">
      <line x1="0" y1="0" x2="0" y2="-38" stroke="#a85638" stroke-width="4"/>
      <path d="M0 -38 h58 l-8 10 8 10 h-58 z" fill="#cb8963"/>
      <text x="8" y="-32" fill="#fffaf1">Transplant</text>
    </g>
    <g transform="translate(330,60)">
      <line x1="0" y1="0" x2="0" y2="-30" stroke="#a85638" stroke-width="4"/>
      <path d="M0 -30 h58 l-8 10 8 10 h-58 z" fill="#78836d"/>
      <text x="8" y="-24" fill="#fffaf1">Follow-up</text>
    </g>
  </g>

  <!-- journey card -->
  <g font-family="Inter, sans-serif">
    <rect x="352" y="130" width="212" height="150" rx="10" fill="#fffaf1" stroke="#d4d3ca" stroke-width="2"/>
    <text x="372" y="156" font-family="Cormorant Garamond, serif" font-size="17" fill="#17292a">Your journey</text>

    <circle cx="378" cy="180" r="7" fill="#204f50"/>
    <path d="M375 180 l2 3 5 -6" stroke="#fffaf1" stroke-width="1.6" fill="none"/>
    <line x1="386" y1="180" x2="410" y2="180" stroke="#aaab9a" stroke-width="2"/>
    <circle cx="418" cy="180" r="7" fill="#204f50"/>
    <path d="M415 180 l2 3 5 -6" stroke="#fffaf1" stroke-width="1.6" fill="none"/>
    <line x1="426" y1="180" x2="450" y2="180" stroke="#aaab9a" stroke-width="2"/>
    <circle cx="458" cy="180" r="7" fill="#78836d"/>
    <line x1="466" y1="180" x2="490" y2="180" stroke="#d4d3ca" stroke-width="2"/>
    <circle cx="498" cy="180" r="7" fill="#fffaf1" stroke="#aaab9a" stroke-width="2"/>

    <text x="372" y="208" font-size="11" letter-spacing="1" fill="#667271">RESOURCES</text>
    <text x="372" y="230" font-size="12.5" fill="#17292a">Medications</text>
    <text x="540" y="230" font-size="12.5" fill="#aaab9a" text-anchor="end">&#8250;</text>
    <line x1="372" y1="238" x2="544" y2="238" stroke="#eee9dc" stroke-width="1.5"/>
    <text x="372" y="256" font-size="12.5" fill="#17292a">Lab monitoring</text>
    <text x="540" y="256" font-size="12.5" fill="#aaab9a" text-anchor="end">&#8250;</text>
    <line x1="372" y1="264" x2="544" y2="264" stroke="#eee9dc" stroke-width="1.5"/>
    <text x="372" y="272" font-size="12.5" fill="#17292a" dy="10">Lifestyle</text>
  </g>
</svg>
